# Freedom B/C: the web root of the "hosting" (cPanel layout, ~/public_html) with the .htaccess files of CO Web and the
# sign-in as on shared hosting. TLS on 443 for the reverse proxy and the site agent; port 80 only answers the health check.
ServerName app

<VirtualHost *:80>
    DocumentRoot /var/www/health
    <Directory /var/www/health>
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /home/co/public_html
    SSLEngine on
    SSLCertificateFile /etc/ssl/freedom/app.crt
    SSLCertificateKeyFile /etc/ssl/freedom/app.key
    <Directory /home/co/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # the client address of the visitor, not the proxy's (logs only)
    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b" freedom
    CustomLog /proc/self/fd/1 freedom
    ErrorLog /proc/self/fd/2
</VirtualHost>
