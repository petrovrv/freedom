; Freedom B/C: PHP limits close to a shared hosting plan (db.php accepts bodies up to 8 MB; uploads of CO Web).
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 300
expose_php = Off
date.timezone = UTC
display_errors = Off
log_errors = On
