<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Почта</title><link rel="stylesheet" href="?m=concierge-mail&amp;f=ui/mail.css"></head>
<body data-pane="list"><header class="topbar"><button id="back" type="button" aria-label="Папки">🗂</button><h1>Почта</h1><button id="compose-new" type="button">✏ Написать</button>
<form id="search-form" role="search"><input id="search" type="search" aria-label="Поиск почты" placeholder="Поиск в почте" autocomplete="off"><button type="submit">Найти</button></form></header>
<div id="connection" role="status" aria-live="polite">Подключение…</div>
<main><nav id="labels" aria-label="Папки почты"></nav>
<section id="list-pane" aria-label="Список писем"><header class="pane-head"><h2 id="list-title">Входящие</h2><button id="refresh" type="button" aria-label="Обновить письма">↻</button></header>
<div id="list-note" role="status"></div><div id="threads"></div><button id="more" type="button" hidden>Ещё</button></section>
<section id="reader" aria-label="Чтение переписки" tabindex="-1"><div id="toolbar" hidden></div><div id="reading"><p class="empty">Выберите письмо</p></div></section></main>
<section id="composer" role="dialog" aria-label="Новое письмо" hidden><header class="composer-head"><h2 id="composer-title">Новое письмо</h2><span id="composer-state" class="small" role="status"></span><button id="composer-close" type="button" aria-label="Закрыть (черновик сохранится)">×</button></header>
<div class="composer-fields"><label>Кому<input id="c-to" autocomplete="off" spellcheck="false"></label><button id="c-more" type="button" class="link-button">Копия</button>
<label class="cc" hidden>Копия<input id="c-cc" autocomplete="off" spellcheck="false"></label><label class="cc" hidden>Скрытая<input id="c-bcc" autocomplete="off" spellcheck="false"></label>
<label>Тема<input id="c-subject" autocomplete="off"></label></div>
<textarea id="c-text" aria-label="Текст письма"></textarea><div id="c-attachments"></div><div id="c-note" class="small"></div>
<footer class="composer-foot"><button id="c-send" type="button" class="primary">Отправить</button><label class="attach-button">📎 Прикрепить<input id="c-file" type="file" multiple hidden></label><button id="c-discard" type="button" aria-label="Удалить черновик">🗑</button></footer></section>
<div id="undo-bar" role="status" hidden><span id="undo-text"></span><button id="undo" type="button">Отменить</button><button id="undo-close" type="button" aria-label="Скрыть">×</button></div>
<aside id="link-bar" aria-label="Адрес ссылки" hidden><label for="link-url">Ссылка из письма</label><input id="link-url" readonly><button id="copy" type="button">Копировать</button><button id="close-link" type="button" aria-label="Закрыть адрес ссылки">×</button><span id="copy-note" role="status"></span></aside>
<script src="/ext/ext1.js"></script><script src="?m=home-relay&amp;f=ui/relay.js"></script><script src="?m=concierge-mail&amp;f=ui/mail.js"></script></body></html>
