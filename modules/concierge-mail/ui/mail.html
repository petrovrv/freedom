<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Почта</title><link rel="stylesheet" href="?m=concierge-mail&amp;f=ui/mail.css"></head>
<body data-pane="list"><header class="topbar"><button id="back" type="button" aria-label="Назад">←</button><h1>Почта</h1>

<div id="connection" role="status" aria-live="polite">Подключение…</div>
<main><nav id="labels" aria-label="Папки почты"></nav>
