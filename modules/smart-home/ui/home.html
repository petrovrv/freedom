<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дом</title><link rel="stylesheet" href="?m=smart-home&amp;f=ui/home.css"></head>
<body><main>
<header><div><span class="eyebrow">УМНЫЙ ДОМ</span><h1>Дом</h1><p id="summary">Подключаем устройства…</p></div><div class="actions"><button id="pair" class="secondary pair" type="button" hidden><span class="radar" aria-hidden="true">⌁</span><span id="pair-label">Сопряжение Zigbee</span></button><button id="refresh" class="secondary">Обновить</button></div></header>
<p id="pair-note" class="small" role="status" hidden></p>
<div id="connection" role="status">Загрузка…</div>
<div class="filters"><input id="search" type="search" placeholder="Найти устройство или комнату" aria-label="Поиск устройств">
<select id="room" aria-label="Комната"><option value="">Все комнаты</option></select></div>
<nav id="kinds" aria-label="Тип устройств"><button data-kind="" class="selected">Всё</button><button data-kind="switch">Свет и розетки</button><button data-kind="climate">Климат</button><button data-kind="sensor">Датчики</button></nav>
<div id="rooms"></div><p id="empty" hidden>Ничего не найдено. Измените фильтр.</p>
<footer>Состояния обновляются автоматически. Управление выполняется через Home Assistant.</footer>
</main><script src="/ext/ext1.js"></script><script src="?m=smart-home&amp;f=ui/pair.js"></script><script src="?m=smart-home&amp;f=ui/home.js"></script></body></html>
