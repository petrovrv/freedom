# aiwb-family: children's sandbox of AI Workbench (tool wsl-family-sandbox). Do not edit by hand.
[boot]
systemd=false
command=/usr/local/sbin/aiwb-family-boot boot

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[network]
generateResolvConf=false
generateHosts=false
hostname=aiwb-family

[user]
default=aiwbsvc
